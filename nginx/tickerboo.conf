# ─────────────────────────────────────────────────────────────────────────────
# nginx/tickerboo.conf
#
# TickerBoo reverse-proxy config for tmc.vetami.net/tb
#
# This is a LOCATION BLOCK snippet — paste inside your existing
# server {} block for tmc.vetami.net (the one with SSL).
#
# If tmc.vetami.net doesn't have a server block yet, use the full
# server block version at the bottom of this file.
# ─────────────────────────────────────────────────────────────────────────────

# ── Drop-in location block (paste inside existing server {}) ─────────────────

    location /tb/ {
        proxy_pass         http://127.0.0.1:8688/;
        proxy_http_version 1.1;

        # Headers FastAPI needs to reconstruct correct URLs
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time push)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts — long enough for big initial syncs
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # Cache static assets aggressively; they're versioned via ?v=hash
        location ~* ^/tb/static/ {
            proxy_pass http://127.0.0.1:8688;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            expires 30d;
        }
    }


